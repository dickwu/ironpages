[package]
name = "ironpages"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust HTML/CSS/Markdown to PDF converter with layout engine, LaTeX math, tables, images, custom fonts, and streaming output. No browser, no system dependencies."
license = "MIT"
repository = "https://github.com/dickwu/ironpages"
documentation = "https://docs.rs/ironpages"
readme = "README.md"
keywords = ["pdf", "html", "css", "markdown", "converter"]
categories = ["text-processing", "encoding", "template-engine"]
exclude = [
    ".github/",
    ".claude/",
    "target/",
    "docs/",
    "bindings/",
    "font-packs/",
    "dist/",
    "tests/parity/",
    "scripts/",
]

[workspace]
resolver = "3"
members = ["bindings/c", "bindings/python", "bindings/ruby/ext/ironpages"]

[patch.crates-io]
ironpages = { path = "." }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ironpages"
path = "src/bin/cli.rs"

[features]
default = []
async = ["tokio"]
remote = ["bogon", "core-net", "ureq", "url"]
wasm = ["wasm-bindgen", "js-sys", "getrandom/wasm_js"]

[dependencies]
cssparser-color = "0.6"
# Our own CSS value parsing uses cssparser 0.38 (shared with cssparser-color 0.6);
# lightningcss alpha.72 keeps its private cssparser 0.37, and no values cross between them.
cssparser = "0.38"
# html5ever 0.40 needs a matching markup5ever_rcdom, whose newest release is 0.39.
html5ever = "0.39"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
# lightningcss is pre-1.0 and declares a caret `parcel_selectors` range; pin the
# selector crate to the exact release this lightningcss alpha was built against
# (alpha.72 -> 0.28.3, cssparser 0.37) so a later 0.28.x cannot swap cssparser.
parcel_selectors = "=0.28.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png_decoder = { package = "png", version = "0.18" }
pulldown-cmark = "0.13"
markup5ever_rcdom = "0.39"
fontdb = "0.24"
flate2 = "1"
lru = "0.19"
resvg = "0.49"
rustybuzz = "0.20"
self_cell = "1"
sha2 = "0.11"
# Exact pin: hinted x-height quantization feeds layout, so upgrades must be deliberate.
# subsetter 0.2.6 still depends on skrifa 0.42, so two copies are built.
skrifa = "=0.49.0"
subsetter = "=0.2.6"
thiserror = "2"
tokio = { version = "1.23.1", features = ["fs", "rt"], optional = true }
bogon = { version = "0.3", optional = true }
core-net = { version = "0.1", optional = true }
# The custom resolver lives in ureq's `unversioned` API. Pin the exact release
# so a compatible-looking minor update cannot change that private contract.
ureq = { version = "=3.5.1", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
language-tags = "0.3.2"
# lightningcss alpha.72 (via ahash) still uses getrandom 0.3 on wasm32. This direct edge
# enables wasm_js for that shared dependency graph; 0.4 would leave 0.3 unconfigured.
getrandom = { version = "0.4", optional = true }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.2"

[dev-dependencies]
tokio = { version = "1.23.1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"
# Visual parity harness (tests/feature_parity.rs) deps.
serde = { version = "1", features = ["derive"] }
rayon = "1"
fs2 = "0.4.3"
tempfile = "3"

[[bench]]
name = "conversion"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
