language = "C"
pragma_once = true
cpp_compat = true
autogen_warning = "// Generated by cbindgen. Update Rust declarations instead of editing this file."
documentation_style = "c99"
documentation_length = "full"
line_length = 100
tab_width = 4
style = "type"
sort_by = "Name"
usize_is_size_t = true

[export]
include = [
    "IronpagesBuffer",
    "IronpagesBytes",
    "IronpagesConverter",
    "IronpagesError",
    "IronpagesStatus",
    "IRONPAGES_ABI_VERSION",
    "IRONPAGES_FALSE",
    "IRONPAGES_FONT_PACK_CJK_JAPANESE",
    "IRONPAGES_FONT_PACK_CJK_KOREAN",
    "IRONPAGES_FONT_PACK_CJK_SIMPLIFIED_CHINESE",
    "IRONPAGES_FONT_PACK_CJK_TRADITIONAL_CHINESE",
    "IRONPAGES_FONT_PACK_EMOJI",
    "IRONPAGES_PAGE_SIZE_A4",
    "IRONPAGES_PAGE_SIZE_LEGAL",
    "IRONPAGES_PAGE_SIZE_LETTER",
    "IRONPAGES_STATUS_CSS",
    "IRONPAGES_STATUS_FONT",
    "IRONPAGES_STATUS_INTERNAL",
    "IRONPAGES_STATUS_INVALID_ARGUMENT",
    "IRONPAGES_STATUS_INVALID_ENUM",
    "IRONPAGES_STATUS_INVALID_HANDLE",
    "IRONPAGES_STATUS_INVALID_UTF8",
    "IRONPAGES_STATUS_IO",
    "IRONPAGES_STATUS_LAYOUT",
    "IRONPAGES_STATUS_OK",
    "IRONPAGES_STATUS_OUTPUT_NOT_EMPTY",
    "IRONPAGES_STATUS_PARSE",
    "IRONPAGES_STATUS_RENDER",
    "IRONPAGES_STATUS_SECURITY",
    "IRONPAGES_TRUE",
]

[fn]
must_use = "IRONPAGES_NODISCARD"
sort_by = "Name"

[parse]
parse_deps = false
