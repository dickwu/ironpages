name: Font packs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'font-packs/**'
      - 'scripts/build-font-packs.sh'
      - '.github/workflows/font-packs.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.1'
      - run: scripts/build-font-packs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ironpages-font-packs
          path: dist/font-packs
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ironpages-font-packs
          path: font-packs
      - name: Attach packs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}" font-packs/* --clobber
          --repo "${GITHUB_REPOSITORY}"
