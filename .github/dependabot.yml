version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/bindings/c"
      - "/bindings/python"
      - "/bindings/ruby/ext/ironpages"
      - "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
