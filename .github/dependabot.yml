version: 2
updates:
  - package-ecosystem: cargo
    directories:
      # The root workspace covers bindings/c, bindings/python and the Ruby
      # extension; fuzz is a separate workspace.
      - "/"
      - "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
